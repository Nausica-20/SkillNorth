{% if page.toc != false %}
<aside class="toc" aria-label="Table of contents">
  <strong>On this page</strong>
  <div id="toc-list"></div>
</aside>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const body = document.querySelector('.article__body');
  const toc = document.getElementById('toc-list');
  if (!body || !toc) return;
  const headings = body.querySelectorAll('h2, h3');
  if (!headings.length) { toc.parentElement.remove(); return; }
  headings.forEach(h => {
    if (!h.id) h.id = h.textContent.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    const a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'toc__sub';
    toc.appendChild(a);
  });
});
</script>
{% endif %}
