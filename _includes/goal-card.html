{% assign goal = include.goal %}
{% assign copy = include.copy | default: 'Build practical skills that support your next move.' %}
{% assign number = include.number | default: 1 %}
<a class="goal-card" href="{{ goal.url | relative_url }}">
  <span class="card-number">{{ number | prepend: '0' | slice: -2, 2 }}</span>
  <span class="goal-card__icon" aria-hidden="true">{{ include.icon | default: '↗' }}</span>
  <h3>{{ goal.name }}</h3>
  <p>{{ copy }}</p>
  <span class="card-arrow">Explore →</span>
</a>
