title: "SkillNorth"
tagline: "Find the skills. Build your future."
description: "Discover practical skills, online courses and learning paths for your next career move."
url: "https://YOURDOMAIN.com"
baseurl: ""
lang: "en"
locale: "en_US"
repository: "YOUR_GITHUB_USERNAME/skillnorth"
logo: "/images/brand/skillnorth-logo.svg"
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
collections:
  courses:
    output: true
    permalink: /courses/reviews/:name/
  learning_paths:
    output: true
    permalink: /learning-paths/:name/

defaults:
  - scope:
      path: "pages"
    values:
      layout: default

# Affiliate configuration lives in data/affiliate.yml.
